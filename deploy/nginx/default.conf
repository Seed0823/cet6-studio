# ============================================================
# Nginx 站点配置
#   1. 托管前端静态文件（前端接口地址是相对路径 /api，无需改任何前端代码）
#   2. 把 /api 请求转发给后端容器
# ============================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    # --------------------------------------------------------
    # 压缩：JS/CSS 可压掉约 70%，对 1M 小带宽服务器收益最明显
    # --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/xml
                      application/javascript text/javascript application/json
                      image/svg+xml;

    # --------------------------------------------------------
    # 带内容哈希的静态资源：一年强缓存，发版后文件名变化自然失效
    # --------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # 入口页不缓存，保证重新部署后用户立刻拿到新版本
    # --------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --------------------------------------------------------
    # 接口反向代理：后端接口本身即以 /api 开头，此处不加路径后缀
    # --------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --------------------------------------------------------
    # 前端使用 hash 路由，这里兜底回入口页（将来改 history 模式也无需再动）
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
