# ============================================================
# 开发环境（默认激活）
# ------------------------------------------------------------
# 特点：打印 SQL、日志更详细，便于本地调试。
# ============================================================
mybatis-plus:
  configuration:
    # 打印执行的 SQL 到控制台。生产环境不开启（见 application-prod.yml），
    # 否则海量 SQL 日志会拖慢 IO 并淹没真正的错误信息。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.cet6.sprint: debug
