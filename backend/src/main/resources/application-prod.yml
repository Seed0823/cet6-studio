# ============================================================
# 生产环境（--spring.profiles.active=prod 或 CET6_PROFILE=prod 激活）
# ------------------------------------------------------------
# 特点：关闭 SQL 打印、收敛日志级别，敏感配置一律走环境变量。
#
# 部署前必须通过环境变量注入：
#   CET6_DB_URL / CET6_DB_USER / CET6_DB_PASSWORD
#   CET6_JWT_SECRET（至少 32 字节，勿用 application.yml 里的默认值）
# ============================================================
mybatis-plus:
  configuration:
    # 显式关闭 SQL 打印（覆盖 dev 的 StdOutImpl）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.cet6.sprint: info
